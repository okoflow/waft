[package]
name = "waft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Waft: dictation, AI text tools and translation for macOS and Windows."
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "waft_lib"

[dependencies]
serde.workspace = true
specta.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-specta.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
specta-typescript.workspace = true

[build-dependencies]
tauri-build.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSResponder", "NSScreen", "NSWindow"] }
objc2-foundation = { workspace = true, features = ["NSGeometry"] }
tauri-nspanel.workspace = true

[target."cfg(windows)".dependencies]
windows = {
  workspace = true,
  features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
  ]
}

[lints]
workspace = true
