disabled_rules:
  - closing_brace
  - colon
  - comma
  - control_statement
  - empty_parentheses_with_trailing_closure
  - function_name_whitespace
  - implicit_getter
  - leading_whitespace
  - no_space_in_method_call
  - private_over_fileprivate
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - statement_position
  - switch_case_alignment
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - unneeded_break_in_switch
  - unused_closure_parameter
  - vertical_parameter_alignment
  - vertical_whitespace
  - void_return

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - async_without_await
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - convenience_type
  - discarded_notification_center_observer
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - empty_collection_literal
  - empty_string
  - fallthrough
  - fatal_error_message
  - file_name
  - file_types_order
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - function_default_parameter_at_end
  - identical_operands
  - implicitly_unwrapped_optional
  - incompatible_concurrency_annotation
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - lower_acl_than_parent
  - optional_enum_case_matching
  - override_in_extension
  - prefer_key_path
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - reduce_into
  - return_value_from_void_function
  - self_binding
  - sorted_first_last
  - static_operator
  - superfluous_else
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_escaping
  - unneeded_throws_rethrows
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_parameter
  - weak_delegate

included:
  - Package.swift
  - Sources
  - Tests

strict: true

cyclomatic_complexity:
  warning: 8
  ignores_case_statements: true

file_length:
  warning: 300

file_types_order:
  order:
    - main_type
    - - extension
      - supporting_type

force_unwrapping:
  ignored_literal_argument_functions: []

function_body_length:
  warning: 40

line_length:
  warning: 130
  ignores_urls: true

type_body_length:
  warning: 200

custom_rules:
  blank_line_before_exit:
    name: Blank Line Before Exit
    regex: '(?<=[^\s{:]\n)(?<!\bin\n)[ \t]*(return|throw|break|continue)\b'
    capture_group: 1
    match_kinds:
      - keyword
    message: Separate a return, throw, break, or continue from the steps before it with a blank line.

  no_bare_animation:
    included:
      - Sources/WaftFeatures/.*\.swift
    excluded:
      - .*/ReducedMotionPolicy\.swift
    name: No Bare Animation
    regex: '\.animation\([^\n]*\bvalue:|^\s*\.animation\((?!Motion\.adapted\()[^\n]*\)\s*\{'
    excluded_match_kinds:
      - comment
      - string
    message: Animate with .motion(_:value:) and a Motion token, or pass a scoped or transition animation through Motion.adapted(_:reducesMotion:), so Reduce Motion shortens it.

  no_comments:
    name: No Comments
    regex: '//(?!\s*(?:swift-tools-version|swiftlint|swiftformat):)|/\*'
    match_kinds:
      - comment
      - doccomment
    message: Say it with a name, a type, or a log message instead of a comment.

  no_nil_coalescing:
    name: No Nil-Coalescing
    regex: '\?\?'
    excluded_match_kinds:
      - string
    message: Unwrap with guard and return early or throw; use a dictionary's default subscript for lookups.

  no_optional_try:
    name: No Optional Try
    regex: '(?<!\blet \w{1,60} = )try\?'
    excluded_match_kinds:
      - string
    message: Bind the result with `let … = try?` only where absence is the result; throw or log every other failure.

  no_xcode_only_macros:
    name: No Xcode-Only Macros
    regex: '@(?:State|Entry|Animatable|AnimatableIgnored|Previewable)\b|#Preview\b'
    excluded_match_kinds:
      - string
    message: Xcode-only SwiftUI macro; the package has to build with the Command Line Tools.
