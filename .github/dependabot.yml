# yaml-language-server: $schema=https://www.schemastore.org/dependabot-2.0.json
version: 2

updates:
  - commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 30
    directory: /
    package-ecosystem: swift
    schedule:
      interval: weekly

  - commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
    directory: /
    package-ecosystem: github-actions
    schedule:
      interval: weekly
