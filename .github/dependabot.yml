# yaml-language-server: $schema=https://www.schemastore.org/dependabot-2.0.json

version: 2

updates:
  - commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
    directory: /
    groups:
      swift-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      swift-security:
        applies-to: security-updates
        patterns:
          - "*"
    package-ecosystem: swift
    schedule:
      interval: weekly

  - commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3
    directory: /
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    package-ecosystem: github-actions
    schedule:
      interval: weekly
