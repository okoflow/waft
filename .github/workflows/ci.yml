# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Library/Developer/CommandLineTools

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: xcode-27

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: |
          brew update
          brew bundle

      - name: Check
        run: make check

      - name: Bundle
        run: make bundle

      - name: Archive the app
        run: ditto -c -k --keepParent build/Waft.app Waft.zip

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: Waft.zip
          retention-days: 1

    timeout-minutes: 30

  launch:
    name: Launch on macOS 15
    needs: check
    runs-on: macos-15

    steps:
      - name: Download the app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app

      - name: Launch
        run: |
          ditto -x -k Waft.zip .
          sw_vers -productVersion

          Waft.app/Contents/MacOS/Waft &
          app=$!

          sleep 15
          kill "${app}"

    timeout-minutes: 10

  compat:
    name: Command Line Tools 26
    runs-on: macos-26

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: make test

    timeout-minutes: 30
