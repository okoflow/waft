name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

env:
  DEVELOPER_DIR: /Library/Developer/CommandLineTools

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    permissions:
      contents: read
    runs-on: xcode-27

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: |
          brew update
          brew bundle

      - name: Check
        run: make check

      - name: Bundle
        run: make bundle

    timeout-minutes: 30

  compat:
    name: Command Line Tools 26
    permissions:
      contents: read
    runs-on: macos-26

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: make build

      - name: Test
        run: make test

    timeout-minutes: 30
