pre-commit:
  jobs:
    - name: format-check
      run: make format-check
      glob:
        - "*.{entitlements,plist,sh,swift}"
        - .editorconfig
        - .swiftformat

    - name: lint
      run: make lint
      glob:
        - "*.swift"
        - .swiftlint.yml

    - name: shellcheck
      run: make shellcheck
      glob:
        - "*.sh"
        - .shellcheckrc

    - name: spelling
      run: make spelling

    - name: secrets-staged
      run: make secrets-staged
